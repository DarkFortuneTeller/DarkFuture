    - !append-once DarkFutureManagedConsumableNarcoticMrWhitey
    - !append-once DarkFutureConsumableAddictive
    - !append-once DarkFutureConsumableAddictiveNarcotic
    - !append-once DarkFutureConsumableOverrideTierWithAddictionHeader
